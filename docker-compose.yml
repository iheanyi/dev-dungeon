services:
  # Game server (SSH + HTTP)
  devdungeon:
    build: .
    container_name: devdungeon-server
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/devdungeon?sslmode=disable
      REDIS_URL: redis://redis:6379
    ports:
      - "2222:2222"  # SSH
      - "8080:8080"  # HTTP
    volumes:
      - devdungeon-ssh:/app/.ssh  # Persist host key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["--server"]
    restart: unless-stopped

  # PostgreSQL database
  postgres:
    image: postgres:18
    container_name: devdungeon-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdungeon
    ports:
      - "5432:5432"
    volumes:
      - devdungeon-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for leaderboards and real-time state
  redis:
    image: redis:7-alpine
    container_name: devdungeon-redis
    ports:
      - "6379:6379"
    volumes:
      - devdungeon-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devdungeon-postgres:
  devdungeon-redis:
  devdungeon-ssh:
