version: '3.8'

services:
  postgres:
    image: postgres:18
    container_name: devdungeon-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdungeon
    ports:
      - "5432:5432"
    volumes:
      - devdungeon-postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devdungeon-redis
    ports:
      - "6379:6379"
    volumes:
      - devdungeon-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devdungeon-postgres:
  devdungeon-redis:
