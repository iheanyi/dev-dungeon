services:
  # Game server (SSH + HTTP)
  devdungeon:
    build: .
    container_name: devdungeon-server
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/devdungeon?sslmode=disable
      REDIS_URL: redis://redis:6379
      # SSH host key path - uses mounted volume for persistence
      SSH_HOST_KEY_PATH: /app/.ssh/devdungeon_host_key
    ports:
      - "2222:2222"  # SSH
      - "8080:8080"  # HTTP
    volumes:
      # Persist SSH host key to prevent "HOST IDENTIFICATION HAS CHANGED" warnings
      - devdungeon-ssh:/app/.ssh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["--server"]
    restart: unless-stopped

  # PostgreSQL database (internal only - use OrbStack for local dev)
  postgres:
    image: postgres:18
    container_name: devdungeon-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: devdungeon
    # No external ports - only accessible within Docker network
    volumes:
      # Postgres 18+ uses /var/lib/postgresql (not /data subdirectory)
      - devdungeon-postgres:/var/lib/postgresql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for leaderboards (internal only)
  redis:
    image: redis:7-alpine
    container_name: devdungeon-redis
    # No external ports - only accessible within Docker network
    volumes:
      - devdungeon-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devdungeon-postgres:
  devdungeon-redis:
  devdungeon-ssh:
