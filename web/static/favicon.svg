<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" fill="#0a0a0a" rx="4"/>

  <!-- Border -->
  <rect x="1" y="1" width="30" height="30" fill="none" stroke="#00ff00" stroke-opacity="0.4" stroke-width="1" rx="3"/>

  <!-- dd text -->
  <text x="16" y="22" text-anchor="middle" fill="#00ff00" font-family="monospace" font-size="14" font-weight="bold" filter="url(#glow)">dd</text>
</svg>
